<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — Sign-up &amp; Login rules</title>
<meta name="description" content="Interactive prototype of the sign-up and login rules from Fifi Lee's onboarding case study.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F3F0E8;--paper:#FBF9F4;--beige:#E9E3D6;--ink:#1F2427;--soft:#3B4246;--mute:#6E716D;--line:#D6D0C3;--acc:#A8482F;--err:#B3261E;--ok:#2E7D5B;--dark:#2C3236}
*{box-sizing:border-box;margin:0}
html,body{overflow-x:hidden}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans","Noto Sans TC",sans-serif;min-height:100vh}
button{font-family:inherit}
.top{display:flex;justify-content:space-between;align-items:center;max-width:1060px;margin:0 auto;padding:24px 24px 0;gap:16px}
.back{font-family:"DM Mono",monospace;font-size:13px;letter-spacing:.08em;text-decoration:none;color:var(--soft)}
.back:hover{color:var(--acc)}
.lang{display:flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.08em;padding:6px 14px;cursor:pointer;color:var(--ink)}
.lang button.on{background:var(--ink);color:var(--paper)}
.wrap{max-width:1060px;margin:0 auto;padding:24px 24px 64px;display:flex;gap:48px;align-items:flex-start;justify-content:center}
/* phone */
.phone{width:375px;height:800px;flex:none;background:var(--paper);border-radius:44px;overflow:hidden;position:relative;box-shadow:0 24px 60px rgba(31,36,39,.22);border:8px solid var(--dark)}
.status{height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 24px 0 28px;font-size:14px;font-weight:600;position:relative;z-index:2}
.island{position:absolute;left:50%;top:8px;transform:translateX(-50%);width:104px;height:28px;border-radius:16px;background:#111;z-index:3}
.hdr{position:absolute;left:0;right:0;top:0;height:180px;background:var(--beige);overflow:hidden}
.hdr svg{position:absolute;top:26px}
.brand{position:absolute;left:22px;top:96px;font-size:11px;font-weight:700;letter-spacing:.12em}
.sheet{position:absolute;left:0;right:0;top:150px;bottom:0;background:var(--paper);border-radius:22px 22px 0 0;padding:18px 0 28px;overflow-y:auto}
.title{font-size:21px;font-weight:700;text-align:center}
.sub{font-size:13.5px;color:var(--mute);text-align:center;margin:6px 24px 0;line-height:1.5}
.tabs{display:flex;margin:12px 22px 2px;border-bottom:1px solid #E3DED2}
.tab{flex:1;text-align:center;padding:10px 0;font-size:14.5px;color:#8E938F;background:none;border:0;cursor:pointer}
.tab.on{color:var(--ink);font-weight:600;border-bottom:2.5px solid var(--acc);margin-bottom:-1px}
.fld{margin:12px 22px 0}
.box{height:46px;border:1px solid var(--line);border-radius:10px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 14px}
.box svg{flex:none}
.box input{border:0;outline:0;flex:1;font:inherit;font-size:15px;color:var(--ink);background:transparent;min-width:0}
.box input::placeholder{color:#9A9E99}
.fld.foc .box{border-color:var(--ink)}
.fld.bad .box{border-color:var(--err);border-width:1.5px}
.below{font-size:12.5px;margin-top:6px;line-height:1.5}
.below.err{color:var(--err)}
.below.hint{color:var(--mute)}
.chk{display:flex;flex-direction:column;gap:3px;margin-top:6px}
.chk span{display:flex;gap:6px;align-items:flex-start;font-size:12px;line-height:1.45;color:var(--mute)}
.chk span i{font-style:normal;font-weight:700;width:12px;flex:none;text-align:center}
.chk span.pass{color:var(--ok)}.chk span.fail{color:var(--err)}
.eye{border:0;background:none;cursor:pointer;padding:0;display:flex}
.reflab{margin:14px 22px 0;font-size:13px;color:var(--mute);background:none;border:0;cursor:pointer;padding:0;display:flex;gap:6px;align-items:center}
.terms{margin:14px 22px 0;font-size:12px;color:var(--mute);line-height:1.55}.terms b{color:var(--acc);font-weight:500}
.rem{margin:14px 22px 0;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);gap:8px}
.rem label{display:flex;align-items:center;gap:8px;cursor:pointer}
.rem input{width:16px;height:16px;accent-color:var(--ink);flex:none}
.rem .link{color:var(--acc);white-space:nowrap;border:0;background:transparent;padding:0;font:inherit;cursor:pointer}
.cta{display:block;margin:18px 22px 0;height:46px;width:calc(100% - 44px);border-radius:10px;border:0;font-size:16px;font-weight:600;cursor:pointer;background:var(--ink);color:var(--paper)}
.cta:disabled{background:#E3DED2;color:#9A9E99;cursor:not-allowed}
.alt{text-align:center;margin-top:16px;font-size:13.5px;color:var(--mute)}
.alt button{background:none;border:0;color:var(--acc);font-weight:600;cursor:pointer;padding:0;font-size:inherit}
.dim{position:absolute;inset:0;background:rgba(31,36,39,.45);z-index:4}
.toast{position:absolute;left:18px;right:18px;top:50px;z-index:5;background:var(--paper);border-radius:12px;padding:13px 15px;display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.45;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.dlg{position:absolute;left:30px;right:30px;top:240px;z-index:5;background:var(--paper);border-radius:16px;padding:24px 20px 20px;text-align:center;box-shadow:0 12px 32px rgba(0,0,0,.25)}
.dlg h4{font-size:17px}.warn{width:42px;height:42px;border-radius:21px;background:#E8B04A;font-weight:800;font-size:22px;display:flex;align-items:center;justify-content:center;margin:14px auto 12px}
.dlg p{font-size:14px;line-height:1.55;color:#4A504D}
.dlg .cta{margin:16px 0 0;width:100%}
.otp{display:flex;gap:8px;justify-content:center;margin:22px 22px 0}
.otp input{width:44px;height:52px;text-align:center;font-size:20px;border:1px solid var(--line);border-radius:10px;font-family:inherit;outline:0;background:#fff}
.otp input:focus{border-color:var(--ink)}
.done{padding:34px 24px 0;text-align:center}
.done .okc{width:56px;height:56px;border-radius:28px;background:var(--ink);color:var(--paper);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:26px}
.done h3{font-size:20px}.done p{font-size:13.5px;color:var(--mute);margin-top:8px;line-height:1.55}
.cred{margin:18px 0 0;border:1px solid var(--line);border-radius:12px;background:#fff;text-align:left;display:flex;overflow:hidden}
.cred .rows{flex:1;min-width:0}
.cred .row{display:flex;align-items:center;padding:12px 14px;gap:12px}
.cred .row+.row{border-top:1px solid #EEE9DF}
.cred small{flex:none;width:68px;font-size:12px;color:var(--mute)}
.cred b{font-family:"DM Mono",monospace;font-size:15px;font-weight:500;letter-spacing:.04em;word-break:break-all}
.cred .cp{flex:none;width:56px;border:0;border-left:1px solid #EEE9DF;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center}
.cred .cp:hover{background:#F6F3EC}
.cred .cp.ok svg{stroke:#2E7D4F}
.done p.copied{font-size:12px;color:#2E7D4F;margin-top:8px;min-height:16px;text-align:left}
.done .cta{width:100%;margin:22px 0 0}
.done .sec{background:transparent;color:var(--ink);border:1.5px solid var(--ink);margin-top:12px}
/* panel */
.panel{width:420px;flex:none;display:flex;flex-direction:column;gap:18px}
.panel h1{font-family:"Noto Serif TC",serif;font-size:26px;line-height:1.35}
.panel .lede{font-size:14.5px;line-height:1.7;color:var(--soft)}
.card{background:var(--paper);border:1px solid #C9C3B4;border-radius:12px;padding:16px 18px}
.card h2{font-family:"DM Mono",monospace;font-size:12px;letter-spacing:.14em;color:var(--acc);font-weight:500;margin-bottom:10px}
.seg{display:flex;background:var(--beige);border-radius:999px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:7px 0;font-size:13.5px;font-weight:600;color:var(--soft);cursor:pointer;font-family:inherit}
.seg button.on{background:var(--ink);color:var(--paper)}
.tries{display:flex;flex-direction:column}
.try{width:100%;border:0;border-top:1px solid #E2DDD1;background:transparent;text-align:left;padding:10px 4px;cursor:pointer;font-family:inherit;color:var(--ink)}
.try:first-child{border-top:0}
.try:hover{background:#F3F0E8}
.try .ar{flex:none;font-family:"DM Mono",monospace;font-size:13px;color:var(--acc)}
.try{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;line-height:1.45}
.try code,.note code,.acct code{font-family:"DM Mono",monospace;font-size:12px;background:var(--beige);padding:1px 5px;border-radius:4px}

.log{display:flex;flex-direction:column;gap:10px;max-height:320px;overflow-y:auto}
.log .it{font-size:13.5px;line-height:1.6;color:var(--soft);padding-left:12px;border-left:2px solid var(--acc)}
.log .it b{color:var(--ink)}
.log .empty{font-size:13.5px;color:var(--mute)}
.acct{font-size:12.5px;line-height:1.9;color:var(--soft)}
.note{font-size:12px;color:var(--mute);line-height:1.65}
@media (max-width:920px){.wrap{flex-direction:column;align-items:center;gap:18px}
.panel{display:contents}
.panel>*{width:100%;max-width:440px}
.panel h1{order:1}.panel .lede{order:2}.c-try{order:3}.phone{order:4;margin:6px 0;scroll-margin-top:12px}.c-log{order:5}.c-acct{order:6}.note{order:7}}
@media (max-width:420px){.top{padding:16px 16px 0}.wrap{padding:16px 12px 48px}.phone{width:100%;max-width:375px}.panel>*{max-width:none}}
</style>
</head>

<div class="top">
<a class="back" href="work01.html" id="back">←</a>

</div>
<div class="wrap">
<div class="phone" id="dev"></div>
<aside class="panel">
<h1 id="ph"></h1>
<p class="lede" id="pl"></p>
<div class="card c-try"><h2 id="tt"></h2><div id="tries"></div></div>
<div class="card c-log"><h2 id="lt"></h2><div class="log" id="log"></div></div>
<div class="card c-acct"><h2 id="at"></h2><div class="acct" id="acct"></div></div>
<p class="note" id="nt"></p>
</aside>
</div>
