<p style="margin: 0; font-size: 14px; color: #3C403E">集團三家公司共用的採購、收貨與請款系統，我負責介面設計。以 Bootstrap 為基礎建立 design system：可換膚的品牌主題，讓三家公司各自以品牌色使用同一套系統；並建立對應程式碼的 Figma 元件庫（按鈕、表單、狀態標籤、Modal 等，含完整狀態與尺寸變體）。前端人力不足時接手開發，以 React 與 TypeScript 完成所有畫面與功能。</p>

<section id="process" style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; align-self: flex-start">
<p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Approach|</p>
<h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 34px; font-weight: 700">我怎麼設計</h2>
</div>
<ol style="flex: 999 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px 48px"><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">01</span><h3 style="margin: 8px 0 0; font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700">先把所有情境攤開</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">畫新的 mockup 前，我會先在 production 走一遍，把主流程和例外都列出來，像是手機號重複、尚未驗證、帳號被鎖。這些情況都先想好，後面才不容易需要整個重改。</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">02</span><h3 style="margin: 8px 0 0; font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700">依用戶在這一頁的目標決定行為</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">在註冊和登入都有「手機／帳號」兩個 tab，但切換規則我刻意做得不一樣：註冊是想盡快完成，因此共用的欄位切換時會連動；登入是兩組不同的憑證，所以必須各自記住、不互相影響。</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">03</span><h3 style="margin: 8px 0 0; font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700">好用和安全一起想</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">錯誤訊息要寫到用戶看得懂，但不能讓人從訊息判斷帳號存不存在。帳號找回流程裡，沒註冊的手機一樣會進到 OTP 頁，但是不會寄出驗證碼；一般用戶察覺不到差別，想試探的人也問不出結果。</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">04</span><h3 style="margin: 8px 0 0; font-family: 'Noto Serif TC', serif; font-size: 20px; font-weight: 700">規則先統一，差異再標清楚</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">三個品牌、三個市場先訂出共用的規則，各品牌特有的再另外標。mockup 上我會用「新增」「修改」標出和 production 不同的地方，工程師知道要改哪裡，QA 也知道要如何測試。</p></li></ol>
</section>

<p style="margin: 0; color: #D6D3CA">The brief was one line: "add mobile sign-up." It ended up reshaping sign-up and login across three brands.</p>

<section id="process" style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px; align-self: flex-start">
<p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Approach|</p>
<h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 500">How I design</h2>
</div>
<ol style="flex: 999 1 560px; min-width: 0; list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); gap: 40px 48px"><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">01</span><h3 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Lay out every scenario first</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">Before drawing a new mockup, I walk through production and list the main path and the exceptions, such as a mobile number already in use, an unverified account or a locked account. Working these out early means fewer full redesigns later.</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">02</span><h3 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Let the user's goal on the page decide the behavior</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">Sign-up and login both have Mobile and Username tabs, but I deliberately gave them different switching rules. Sign-up is about finishing fast, so shared fields carry over when you switch; login holds two different sets of credentials, so each tab remembers its own and they don't interfere.</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">03</span><h3 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Design for ease and security together</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">Error messages should make sense to users without letting anyone tell whether an account exists. In account recovery, an unregistered number still reaches the OTP page, but no code is sent. Real users don't notice a difference, and anyone probing learns nothing.</p></li><li style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 32px; border-bottom: 1px solid #C9C3B4"><span style="width: 44px; height: 44px; border: 1px solid #C9C3B4; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'DM Mono', monospace; font-size: 12px; color: #5E625F">04</span><h3 style="margin: 8px 0 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Unify the rules, then mark the differences</h3><p style="margin: 0; font-size: 14px; line-height: 1.9; color: #3C403E">Across three brands and three markets, we first set the shared rules, then marked what's brand-specific. On mockups I tag what's new and what's changed against production, so engineers know what to change and QA knows how to test it.</p></li></ol>
</section>
