<style>
:root{--bg:#F3F0E8;--paper:#FBF9F4;--ink:#1F2427;--ink2:#3C403E;--mute:#5E625F;--line:#C9C3B4;--accent:#A8482F;--accent-d:#8A3A25;--accent-l:#E59A7F;--good:#2E7D4F;--mid:#B07A12;--bad:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans TC',sans-serif;font-size:16px;line-height:1.9;letter-spacing:.04em}
a{color:var(--ink)}a:hover{color:var(--accent)}
.wrap{max-width:1000px;margin:0 auto;padding:0 24px}
.eyebrow{margin:0;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.16em;color:var(--accent)}
.hd{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px;padding-top:28px;padding-bottom:28px;max-width:1200px}
.brand{text-decoration:none;display:flex;align-items:baseline;gap:12px}
.nav{display:flex;flex-wrap:wrap;align-items:center;gap:20px;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.12em}
.nav a{text-decoration:none}
.lang{display:inline-flex;border:1px solid var(--ink);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;min-height:32px;padding:4px 14px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--ink);cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
h1{margin:0;font-family:'Noto Serif TC',serif;font-weight:700;font-size:46px;line-height:1.4;letter-spacing:.04em}
html[lang="en"] h1,html[lang="en"] h2{font-family:'Cormorant Garamond',serif;font-weight:500;letter-spacing:.01em}
html[lang="en"] h1{font-size:54px;line-height:1.15}
.hero{padding-top:48px;padding-bottom:40px;display:flex;flex-direction:column;gap:20px}
.lead{margin:0;max-width:680px;font-size:17px;color:var(--ink2)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px}
form{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px}
input[type=url]{flex:1 1 320px;min-width:0;height:52px;padding:0 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:16px;color:var(--ink)}
input[type=url]:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.go{height:52px;padding:0 28px;border:0;border-radius:999px;background:var(--accent);color:var(--paper);font-family:'DM Mono',monospace;font-size:14px;letter-spacing:.12em;cursor:pointer}
.go:hover{background:var(--accent-d)}.go:disabled{background:#C9C3B4;cursor:not-allowed}
.hint{margin:0;font-size:13px;color:var(--mute)}
.err{margin:0;font-size:14px;color:var(--bad)}
.f-err{margin:-4px 0 0 4px;font-size:13px;line-height:1.6;color:#b2452d}
.f-err::before{content:'!';display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;margin-right:6px;border-radius:50%;background:#b2452d;color:#fff;font-size:10px;font-weight:700;vertical-align:1px}
#u[aria-invalid="true"]{border-color:#b2452d}
.pending{margin:0;display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--ink2)}
.pending::before{content:'';flex:none;margin-top:5px;width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.pending::before{animation:none}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:15px;color:var(--mute)}
.steps li{display:flex;gap:10px;align-items:center}
.steps li::before{content:'';width:10px;height:10px;border-radius:50%;border:1px solid var(--line)}
.steps li.on{color:var(--ink)}.steps li.on::before{background:var(--accent);border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
.steps li.done::before{background:var(--good);border-color:var(--good);animation:none}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion: reduce){.steps li.on::before{animation:none}}
.res{display:flex;flex-direction:column;gap:28px;padding-bottom:80px}
.res h2{margin:0;font-family:'Noto Serif TC',serif;font-size:28px;line-height:1.5}
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.sc{background:var(--paper);padding:18px 20px;display:flex;flex-direction:column;gap:2px}
.sc b{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:500;line-height:1.1}
.sc span{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--mute)}
.g{color:var(--good)}.m{color:var(--mid)}.b{color:var(--bad)}
.summary{margin:0;font-size:19px;font-weight:700;line-height:1.7}
.finds{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.finds li{display:grid;grid-template-columns:44px 1fr;gap:4px 16px;padding:22px 0;border-bottom:1px solid var(--line)}
.finds .n{font-family:'Cormorant Garamond',serif;font-size:34px;line-height:1;color:var(--accent);grid-row:span 5}
.finds h3{margin:0;font-family:'Noto Serif TC',serif;font-size:19px;line-height:1.5}
.finds p{margin:0;font-size:15px;color:var(--ink2)}
/* label + text as two columns, so wrapped lines stay aligned like a table */
.finds p,.tells li p{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:8px;align-items:baseline}
html[lang="en"] .finds p,html[lang="en"] .tells li p{grid-template-columns:72px minmax(0,1fr)}
.finds p .lab,.tells li p .lab{margin-right:0}
.journey{margin:18px 0 26px;padding:16px 20px;border-left:3px solid var(--accent);background:rgba(170,74,46,.06);border-radius:0 12px 12px 0}
.journey b{display:block;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--accent);margin-bottom:4px}
.journey p{margin:0;font-size:15px;line-height:1.8;color:var(--ink2)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 4px}
.chip{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.chip.high{color:#fff;background:#b2452d;border-color:#b2452d}
.chip.medium{color:#8a5a00;background:#f6e7c4;border-color:#ecd59b}
.chip.low{color:var(--ink2)}
.tells{margin:28px 0 0}
.tells h3{margin:0 0 4px;font-family:'Noto Serif TC',serif;font-size:17px}
.tells .sub{margin:0 0 12px;font-size:13px;color:var(--mute)}
.tells ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.tells li{padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card,#fbf9f4)}
.tells li b{display:block;font-size:15px;margin-bottom:6px}
.tells li p{margin:4px 0 0;font-size:14px;color:var(--ink2)}
.tells .lab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--mute);margin-right:8px}
.radar{margin:32px 0 0;padding:26px 28px;background:#fff;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:16px;box-shadow:0 10px 30px -18px rgba(31,36,39,.25)}
.radar h3{margin:0 0 4px;font-family:'Noto Serif TC',serif;font-size:20px;color:var(--accent)}
.radar .sub{margin:0 0 16px;font-size:14px;color:var(--mute)}
.radar ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.radar li{padding:14px 0;border-top:1px solid var(--line)}
.radar q{display:inline-block;padding:3px 10px;background:var(--bg);border-radius:6px;font-family:'DM Mono',monospace;font-size:14px;color:var(--ink);quotes:'「' '」'}
.radar li p{margin:8px 0 0;font-size:15px;line-height:1.8;color:var(--ink2)}

/* phones: label on its own line above each 現況／預期／建議 text */
@media (max-width:600px){

}
.finds .lab{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--mute);margin-right:8px}
.close{background:var(--ink);color:var(--bg);border-radius:12px;padding:32px;display:flex;flex-direction:column;gap:16px}
.close p{margin:0;font-size:16px;color:#D6D3CA}
.close .btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.12em;padding:10px 22px;border:1px solid currentColor;border-radius:999px;text-decoration:none}
.close .btn{color:var(--bg)}.close .btn.pri{background:var(--accent);border-color:var(--accent)}
.meta{font-size:12px;color:var(--mute);margin:0}

[hidden]{display:none !important}
@media (max-width:760px){h1{font-size:32px}html[lang="en"] h1{font-size:38px}.card{padding:22px}.go{width:100%}.nav .hide-sp{display:none}}

    document.querySelectorAll('.lang button').forEach(function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-set') === L ? 'true' : 'false'); });
    if (last) render(last);
    showPending();
  }
  document.querySelectorAll('.lang button').forEach(function (b) {
    b.addEventListener('click', function () { L = b.getAttribute('data-set'); try { localStorage.setItem('fifi-lang', L); } catch (e) {} apply(); });
  });

  // a URL handed over from the services page: fill it in and run once the human check passes
  var autoRun = false;
  try { var pre = new URLSearchParams(location.search).get('url'); if (pre) { $('u').value = pre.slice(0, 300); autoRun = true; } } catch (e) {}
  function showPending() {
    // tell the visitor the check will start by itself
    if (!autoRun) return;
    $('go').disabled = true; $('go').textContent = T[L].waiting;
    $('pending').textContent = T[L].pending; $('pending').hidden = false;
  }
  function mountTurnstile() {
    if (!window.turnstile) { setTimeout(mountTurnstile, 200); return; }
    widget = window.turnstile.render('#ts', {
      sitekey: SITE_KEY, action: 'check', theme: 'light', language: L === 'en' ? 'en' : 'zh-tw',
      callback: function (t) { token = t; if (autoRun) { autoRun = false; $('f').requestSubmit(); } }, 'expired-callback': function () { token = ''; }, 'error-callback': function () { token = ''; }
    });
  }
  mountTurnstile();

  function wait(min) {
    var h = Math.floor(min / 60), m = min % 60;
    if (L === 'zh') return h ? h + ' 小時' + (m ? ' ' + m + ' 分鐘' : '') : m + ' 分鐘';
    return h ? h + (h > 1 ? ' hours' : ' hour') + (m ? ' ' + m + ' min' : '') : m + ' minutes';
  }
  // URL field: format checked on blur, shown right under the field
  function urlProblem(v) { return !v ? 'empty' : /^(https?:\/\/)?[^\s\/]+\.[^\s\/]{2,}(\/\S*)?$/i.test(v) ? '' : 'bad_url'; }
  function fieldErr(code) {
    var box = $('uErr');
    if (!code) { box.hidden = true; $('u').setAttribute('aria-invalid', 'false'); return; }
    box.textContent = T[L].e[code]; box.hidden = false; $('u').setAttribute('aria-invalid', 'true');
  }
  $('u').addEventListener('blur', function () { var v = $('u').value.trim(); fieldErr(v ? urlProblem(v) : ''); });
  $('u').addEventListener('input', function () { if (!$('uErr').hidden) fieldErr(urlProblem($('u').value.trim())); });
  function showErr(code, d) {
    if (code === 'bad_url' || code === 'empty') { fieldErr(code); $('u').focus(); return; }
    var t = T[L].e, msg = t[code] || t.net;
    if (code === 'busy') msg = msg.replace('{t}', wait(Math.max(1, (d && d.retryMin) || 60)));
    if (d && d.code) msg += (L === 'zh' ? '（錯誤代碼：' : ' (Error code: ') + String(d.code).slice(0, 20) + (L === 'zh' ? '）' : ')');
    $('err').textContent = msg; $('err').hidden = false;
  }
  var timers = [];
  function steps(on) {
    timers.forEach(clearTimeout); timers = [];
    var li = document.querySelectorAll('#steps li');
    $('steps').hidden = !on;
    li.forEach(function (x) { x.className = ''; });
    if (!on) return;
    li[0].className = 'on';
    timers.push(setTimeout(function () { li[0].className = 'done'; li[1].className = 'on'; }, 3000));
    timers.push(setTimeout(function () { li[1].className = 'done'; li[2].className = 'on'; }, 25000));
  }

  $('f').addEventListener('submit', function (ev) {
    ev.preventDefault();
    $('err').hidden = true;
    var url = $('u').value.trim();
    var prob = urlProblem(url); if (prob) { showErr(prob); return; } fieldErr('');
    if (!token) { showErr('wait'); return; }
    $('pending').hidden = true;
    $('go').disabled = true; $('go').textContent = T[L].going; $('res').hidden = true; steps(true);
    fetch('/api/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ url: url, token: token, lang: L }) })
      .then(function (r) { return r.json().catch(function () { return { error: 'net' }; }); })
      .then(function (d) {
        steps(false);
        if (d.error) { showErr(d.error, d); return; }
        last = d; render(d);
        $('res').hidden = false; $('res').scrollIntoView({ behavior: 'smooth', block: 'start' });
      })
      .catch(function () { steps(false); showErr('net'); })
      .finally(function () {
        $('go').disabled = false; $('go').textContent = T[L].go; token = '';
        if (window.turnstile && widget !== null) window.turnstile.reset(widget);
      });
  });

  function tone(n) { return n === null || n === undefined ? '' : n >= 90 ? 'g' : n >= 50 ? 'm' : 'b'; }
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }

  // everything from the API is inserted as text, never as HTML
  function render(d) {
    var t = T[L];
    $('resUrl').textContent = d.url;
    $('resMeta').textContent = (d.cached ? t.cached + ' ' : '') + t.checked + new Date(d.checkedAt).toLocaleString(L === 'en' ? 'en' : 'zh-TW');
    var sc = $('scores'); sc.textContent = '';
    var s = d.scores;
    if (!s) sc.appendChild(el('p', 'hint', t.noScores));
    if (s) [['perf', s.performance], ['a11y', s.accessibility], ['bp', s.bestPractices], ['seo', s.seo], ['lcp', s.lcp]].forEach(function (x) {
      if (x[1] === null || x[1] === undefined) return;
      var c = el('div', 'sc'); var b = el('b', x[0] === 'lcp' ? '' : tone(x[1]), String(x[1]));
      c.appendChild(b); c.appendChild(el('span', '', t[x[0]])); sc.appendChild(c);
    });
    $('sum').textContent = d.advice.summary;
    var ol = $('finds'); ol.textContent = '';
    d.advice.findings.forEach(function (f, i) {
      var li = el('li');
      li.appendChild(el('span', 'n', String(i + 1).padStart(2, '0')));
      li.appendChild(el('h3', '', f.title));
      if (f.severity || f.where) {
        var tg = el('div', 'tags');
        if (f.severity && t.sev[f.severity]) tg.appendChild(el('span', 'chip ' + f.severity, t.sev[f.severity]));
        if (f.where) tg.appendChild(el('span', 'chip', f.where));
        li.appendChild(tg);
      }
      [[t.cur, f.current || f.why], [t.exp, f.expected], [t.fix, f.fix]].forEach(function (r) {
        if (!r[1]) return;
        var p = el('p'); p.appendChild(el('span', 'lab', r[0])); p.appendChild(document.createTextNode(r[1])); li.appendChild(p);
      });
      ol.appendChild(li);
    });
    $('journey').hidden = !d.advice.journey;
    $('journeyT').textContent = t.journeyT; $('journeyP').textContent = d.advice.journey || '';
    var tl = d.advice.tells || [], tu = $('tellsL'); tu.textContent = '';
    // show the section whenever the result has this check; an empty list means nothing was found
    $('tells').hidden = !Array.isArray(d.advice.tells); $('tellsT').textContent = t.tellsT;
    $('tellsS').textContent = tl.length ? t.tellsS : t.tellsNone;
    tl.forEach(function (n) {
      var li = el('li'); li.appendChild(el('b', '', n.issue));
      [[t.evid, n.evidence], [t.fix, n.fix]].forEach(function (r) { if (!r[1]) return; var p = el('p'); p.appendChild(el('span', 'lab', r[0])); p.appendChild(document.createTextNode(r[1])); li.appendChild(p); });
      tu.appendChild(li);
    });
    var np = d.advice.nitpicks || [], rl = $('radarL'); rl.textContent = '';
    $('radar').hidden = !np.length;
    $('radarT').textContent = t.radarT; $('radarS').textContent = t.radarS;
    np.forEach(function (n) { var li = el('li'); var q = el('q', '', n.quote); if (L === 'en') q.style.quotes = '"\u201C" "\u201D"'; li.appendChild(q); li.appendChild(el('p', '', n.note)); rl.appendChild(li); });
    $('closing').textContent = d.advice.closing;
    $('ctaContact').href = 'services.html?lang=' + L + '&topic=check&site=' + encodeURIComponent(d.url) + (L === 'en' ? '#contact-en' : '#contact');
  }

  apply();
})();
</script>
