      fbRating = b.getAttribute('data-r');
      $('fb').querySelectorAll('.fb-b').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      $('fbTags').hidden = fbRating !== 'down';
      $('fbMore').hidden = false;
    });
  });
  $('fb').addEventListener('submit', function (ev) {
    ev.preventDefault();
    if (!fbLog || !fbRating) return;
    var t = T[L];
    var tags = [].map.call($('fbTags').querySelectorAll('input:checked'), function (c) { return c.value; });
    $('fbSend').disabled = true; $('fbErr').hidden = true;
    fetch('/api/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({
      logId: fbLog, rating: fbRating, tags: fbRating === 'down' ? tags : [], comment: $('fbC').value, lang: L,
      website: $('fb').querySelector('input[name=website]').value,
    }) }).then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); }).then(function (x) {
      if (!x.ok) throw new Error(x.d && x.d.error === 'quota' ? 'quota' : 'fail');
      $('fbMore').hidden = true; $('fbDone').textContent = t.fbDone; $('fbDone').hidden = false;
      $('fb').querySelectorAll('.fb-b').forEach(function (b) { b.disabled = true; });
      track('feedback_sent', 'feedback', fbRating);
    }).catch(function (e) {
      $('fbErr').textContent = e.message === 'quota' ? t.fbQuota : t.fbErr; $('fbErr').hidden = false; $('fbSend').disabled = false;
    });
  });

  apply();
})();
</script>
</body>
