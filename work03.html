<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">With AI|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">AI 在哪裡幫上忙</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M14 3H6v18h6"></path><path d="M14 3l4 4v4"></path><circle cx="16" cy="16" r="3"></circle><path d="m21 21-2.8-2.8"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">畫 mockup 前</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">畫之前先比對</h3><p style="margin: 0; font-size: 14px; color: #3C403E">新需求進來時，請 Claude 比對決策庫，提醒哪些規則已經定過、哪些和其他品牌衝突。</p></div>
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M10 7v10" stroke-dasharray="2 2"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">UAT 期間</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">開單和抓錯</h3><p style="margin: 0; font-size: 14px; color: #3C403E">把 UAT 發現的問題丟給 AI，整理成統一的雙語開單格式。它也曾經抓到我自己沒發現的錯誤。</p></div>
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10.5h6"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">隨時</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">回答規則提問</h3><p style="margin: 0; font-size: 14px; color: #3C403E">PDM 來問規則時，我先問 AI、再對照依據，回覆時直接附上出處，不用再翻聊天紀錄。</p></div>
</div>
<div style="padding: 20px 24px; background: #FBF9F4; border-left: 3px solid #A8482F; border-radius: 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">實際例子</span><p style="margin: 0; font-size: 15px; color: #3C403E">我在寫一張 UAT 單時把畫面截圖丟給 AI，它比對決策庫後提醒我：畫面上的一句錯誤訊息和 mockup 不一樣，也和其他平台不同，要我先去確認。結果是工程師把文案打錯了。這種跨文件、跨平台的不一致，人工檢查時很容易漏掉。</p></div>
<img src="img/9eca097b6c620529c79c9dd38bbaa0c6.png" alt="示意：撰寫 UAT 單時，AI 比對截圖、決策庫、mockup 與其他平台後，發現錯誤訊息文案打錯" onClick="{{openZoom}}" style="cursor: zoom-in; width: 100%; aspect-ratio: 1600 / 690; object-fit: cover; border-radius: 8px; display: block">
</section>

<section style="background: #1F2427; color: #F3F0E8; margin-top: 112px; padding: 112px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #E59A7F">Outcome|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">成果</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Noto Serif TC', serif; font-size: 24px; line-height: 1.5">翻聊天紀錄 → 一搜就有</span><span style="font-size: 14px; color: #D6D3CA">找一條規則從「回想在哪裡講過」變成直接搜尋，答案附上出處。</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Noto Serif TC', serif; font-size: 24px; line-height: 1.5">在設計 Recap 分享 AI 用法</span><span style="font-size: 14px; color: #D6D3CA">建立測試帳號、設定 Jira filter、判讀問題單並估 story point，其他設計師都覺得實用。</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Noto Serif TC', serif; font-size: 24px; line-height: 1.5">同事認為有延展價值</span><span style="font-size: 14px; color: #D6D3CA">決策庫的架構分享給幾位同事看過，他們認為可以延伸成團隊共用的知識來源。</span></div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Reflection|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">反思與下一步</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">先有結構，AI 才可靠</h3><p style="margin: 0; color: #3C403E">AI 能準確比對，是因為每條規則都寫成一句話、標好適用範圍。先把散落的資料整理好，比選用哪個 AI 工具更重要。</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">限制：只有我在用</h3><p style="margin: 0; color: #3C403E">團隊當時沒有 AI 工具，這套方法只能停在個人實驗。我先在 Recap 分享做法，讓大家知道可以怎麼用。</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">下一步：加入「待優化」狀態</h3><p style="margin: 0; color: #3C403E">AC 確認後，開發就很難再調整。這可以理解，每次修改都要多花時間，但當下來不及做的改善，不該就這樣被忘記。我想在決策庫加入「待優化」狀態，把來不及做的改善記下來，等同一個功能再排進 sprint 時，帶著依據提出。</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">如果團隊導入 AI</h3><p style="margin: 0; color: #3C403E">如果團隊導入 AI，決策庫可以直接成為共用的知識來源，讓 PDM、工程、QA 都能自己查規則。</p></div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 20px; align-items: baseline"><span style="font-family: 'Cormorant Garamond', serif; font-size: 72px; line-height: 1; color: #A8482F">03</span><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #5E625F">Late 2025 – 2026.09</span></div>
<h1 class="hero-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 60px; font-weight: 500; line-height: 1.15">An AI-assisted design decision library</h1>
<p style="margin: 0; max-width: 760px; font-size: 18px; color: #3C403E">Before my team had shared AI tools, I used Notion and Claude to build myself a decision library. Every rule links back to its source, and I use it to check specs, write UAT tickets, and answer the rule questions my squad kept asking.</p>
<dl class="meta" style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #C9C3B4; border: 1px solid #C9C3B4">
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">ROLE</dt><dd style="margin: 0; font-size: 14px">Initiated, designed &amp; built</dd></div>

<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">STATUS</dt><dd style="margin: 0; font-size: 14px">Personal workflow experiment</dd></div>
<div style="grid-column: 1 / -1; background: #FBF9F4; padding: 20px; display: flex; flex-direction: column; gap: 6px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">OUTCOME</dt><dd style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.6">Finding a rule went from digging through chat to one search, source attached · shared at design recaps</dd></div>

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Background|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">The problem</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">In late 2025 the team reorganized into squads, and many members came from outside product work. In meetings the same rule would be asked about again and again, and designers were the first to be asked.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Rules asked on repeat</h3><p style="margin: 0; font-size: 14px; color: #3C403E">Even the PDM was often unsure, so meeting time went to re-confirming.</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Brands contradicting</h3><p style="margin: 0; font-size: 14px; color: #3C403E">One field behaved differently by brand, market and platform.</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Decisions scattered</h3><p style="margin: 0; font-size: 14px; color: #3C403E">Buried in mockups or tickets, with no trace of who decided or why.</p></div>
</div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">With AI|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">Where AI helps</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M14 3H6v18h6"></path><path d="M14 3l4 4v4"></path><circle cx="16" cy="16" r="3"></circle><path d="m21 21-2.8-2.8"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">BEFORE MOCKUP</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Check before drawing</h3><p style="margin: 0; font-size: 14px; color: #3C403E">For each new request, Claude checks the library and flags rules already decided or conflicting across brands.</p></div>
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 7h16v3a2 2 0 0 0 0 4v3H4v-3a2 2 0 0 0 0-4z"></path><path d="M10 7v10" stroke-dasharray="2 2"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">DURING UAT</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Tickets and catches</h3><p style="margin: 0; font-size: 14px; color: #3C403E">UAT findings go to AI and come back as consistent bilingual tickets. It has caught errors I had missed.</p></div>
<div style="flex: 1 1 300px; min-width: 0; background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 5h16v11H9l-5 4z"></path><path d="M9 10.5h6"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">ANY TIME</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Answer rule questions</h3><p style="margin: 0; font-size: 14px; color: #3C403E">When the PDM asks about a rule, I ask AI, check the source, and reply with the link instead of digging through chat.</p></div>

<div style="padding: 20px 24px; background: #FBF9F4; border-left: 3px solid #A8482F; border-radius: 4px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">A REAL CATCH</span><p style="margin: 0; font-size: 15px; color: #3C403E">While I was writing a UAT ticket, I gave AI a screenshot of the build. It checked it against the library and flagged that an error message differed from the mockup and from the other platforms, and asked me to confirm. The engineer had mistyped the copy. Inconsistencies across documents and platforms like this are easy to miss by eye.</p></div>

<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">From digging through chat to one search</span><span style="font-size: 14px; color: #D6D3CA">Finding a rule went from "where did we say that?" to a search, with the source attached.</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">Shared at design recaps</span><span style="font-size: 14px; color: #D6D3CA">Setting up test accounts, Jira filters, reading tickets to estimate story points. Fellow designers found it useful.</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">Seen as worth scaling</span><span style="font-size: 14px; color: #D6D3CA">Colleagues who saw the structure felt it could grow into a shared team knowledge base.</span></div>
</div>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Reflection|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">What's next</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Structure first, then AI</h3><p style="margin: 0; color: #3C403E">AI could compare reliably because every rule was one tagged sentence. Getting scattered information organized first mattered more than which AI tool I used.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">The limit: only I used it</h3><p style="margin: 0; color: #3C403E">Without team AI tools, it stayed a personal experiment. I shared the approach at recaps so others could see how to use it.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Next: a "to improve" status</h3><p style="margin: 0; color: #3C403E">Once an AC is signed off, development rarely changes course. That is fair, since every change costs time, but improvements we could not fit in at the time should not be forgotten. I want to add a "to improve" status to the library, so improvements we could not fit in are logged and can be raised, with reasoning, the next time that feature enters a sprint.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">If the team adopts AI</h3><p style="margin: 0; color: #3C403E">With team-wide AI, the library could become a shared source where PDM, engineering and QA look up rules themselves.</p></div>

<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { lang: 'zh', zoom: null };
try { if (window.localStorage.getItem('fifi-lang') === 'en') this.state = { lang: 'en', zoom: null }; } catch (e) {}
try { window.addEventListener('storage', (ev) => { if (ev.key === 'fifi-lang') this.setState({ lang: ev.newValue === 'en' ? 'en' : 'zh' }); }); } catch (e) {}
}
renderVals() {
var isZh = this.state.lang === 'zh';
var base = 'min-height: 32px; padding: 4px 14px; border: 0; cursor: pointer; font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 0.08em; ';
var on = base + 'background: #1F2427; color: #F3F0E8;';
var off = base + 'background: transparent; color: #1F2427;';
var t = isZh
? { pl: '上一個', pt: '02 帳號密碼找回流程', nl: '返回', nt: '所有作品', zoom: '放大檢視', close: '關閉', pan: '左右滑動查看完整圖片，點一下關閉', back: '← 作品', prev: '← 02 帳號密碼找回流程', all: '所有作品 →' }
: { pl: 'PREVIOUS', pt: '02 Password recovery', nl: 'BACK', nt: 'All works', zoom: 'Enlarged image', close: 'Close', pan: 'Swipe to pan, tap to close', back: '← Works', prev: '← 02 Password recovery', all: 'All works →' };
return {
t: t,
isZh: isZh,
isEn: !isZh,
zhStyle: isZh ? on : off,
enStyle: isZh ? off : on,
zoomOpen: !!this.state.zoom,
zoomSrc: this.state.zoom || '',
openZoom: (ev) => { var el = ev && (ev.currentTarget || ev.target); var src = el && el.getAttribute ? el.getAttribute('src') : null; if (src) this.setState({ lang: this.state.lang, zoom: src }); },
closeZoom: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); this.setState({ lang: this.state.lang, zoom: null }); },
setZh: () => { try { window.localStorage.setItem('fifi-lang', 'zh'); } catch (e) {} this.setState({ lang: 'zh', zoom: null }); },
setEn: () => { try { window.localStorage.setItem('fifi-lang', 'en'); } catch (e) {} this.setState({ lang: 'en', zoom: null }); }
};
}
}

DC.mount(Component);
</script>
</body>
</html>
