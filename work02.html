<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 28px">

<h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 52px; font-weight: 700; line-height: 1.4">帳號密碼找回流程</h1>
<p style="margin: 0; max-width: 760px; font-size: 18px; color: #3C403E">忘記帳號、密碼或被鎖帳時，找回流程是用戶唯一的出路。我負責品牌 A 的設計與上線：把流程拉回主站、讓每個卡住的地方都有自助的下一步，同時不讓人藉此查出誰註冊過。</p>
<dl class="meta" style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #C9C3B4; border: 1px solid #C9C3B4">
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">角色</dt><dd style="margin: 0; font-size: 14px">品牌 A 主要 UIUX 設計師</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">範圍</dt><dd style="margin: 0; font-size: 14px">品牌 A・3 市場・App 與 Web</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">流程</dt><dd style="margin: 0; font-size: 14px">輸入・資格檢查・OTP・重設密碼</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">狀態</dt><dd style="margin: 0; font-size: 14px">已上線</dd></div>
</dl>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Background|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">背景與問題</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">用戶走進這個流程時，通常已經有點著急：忘了帳號或密碼，或是登入連續失敗 5 次、帳號被鎖住。改版前，找回只能填 Email，收信後點連結、在另開的分頁重設密碼，連結時間一到就失效。收不到信或連結過期的人，只能找客服。</p>
<p style="margin: 0">舊的註冊表單一定要填 Email，所以原有用戶都有 Email。但這次註冊移除了 Email 欄位（見<a href="work01.html">作品 01</a>），新用戶很可能根本沒有 Email，舊流程對他們完全走不通，所以一定要加入手機找回。這次我們把整個流程拉回主站內完成，同時要顧及：這裡也是最容易被濫用的入口。</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">一支手機，多個帳號</h3><p style="margin: 0; font-size: 14px; color: #3C403E">同一支手機可以註冊多個帳號，用手機找回時，系統不知道要找哪一個。</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">不能洩漏誰註冊過</h3><p style="margin: 0; font-size: 14px; color: #3C403E">如果直接回答「這支手機沒註冊」，就等於讓人能一支一支測試。</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">卡住就找客服</h3><p style="margin: 0; font-size: 14px; color: #3C403E">收不到驗證碼、次數用完、不符合資格，每一處卡住都會變成一張客服單。</p></div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Before &amp; After|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">把找回流程拉回主站</h2></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 36px 32px; display: flex; flex-direction: column; gap: 32px">
<div style="display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 16px 32px; align-items: center" class="ba-row">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #A8482F">改版前</span><span style="font-size: 18px; font-weight: 700">Email 連結</span><span style="font-size: 13px; color: #5E625F; line-height: 1.6">只能用 Email，流程中途離開主站。</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch"><div style="flex: 1 1 180px; min-width: 0; background: #EFEBE1; border: 1.5px solid #C9C3B4; border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5E625F">主站</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 14px; line-height: 1.5">輸入 Email</span></div></div></div><div style="flex: 3 1 540px; min-width: 0; background: repeating-linear-gradient(135deg, #F7E3DA 0 6px, #FBF0EA 6px 12px); border: 1.5px dashed #A8482F; border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #8A3A25">站外</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 14px; line-height: 1.5">到信箱點重設連結</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 14px; line-height: 1.5">在新分頁設定密碼</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #A8482F; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; color: #8A3A25"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #A8482F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg></span><span style="font-size: 14px; line-height: 1.5; font-weight: 500">連結過期就要重來</span></div></div></div></div>
</div>
<div style="border-top: 1px solid #E3DED2"></div>
<div style="display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 16px 32px; align-items: center" class="ba-row">
<div style="display: flex; flex-direction: column; gap: 4px"><span style="font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #A8482F">改版後</span><span style="font-size: 18px; font-weight: 700">OTP 驗證</span><span style="font-size: 13px; color: #5E625F; line-height: 1.6">手機或 Email 都能用，全程留在主站。</span></div>
<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch"><div style="flex: 4 1 720px; min-width: 0; background: #EFEBE1; border: 1.5px solid #C9C3B4; border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5E625F">主站</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 14px; line-height: 1.5">輸入手機或 Email</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 14px; line-height: 1.5">同一頁輸入驗證碼</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 14px; line-height: 1.5">重設密碼</span></div><div style="flex: 1 1 140px; min-width: 0; background: #DCEBDD; border: 1px solid #9CC3A2; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; color: #24502C"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #24502C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 14px; line-height: 1.5; font-weight: 500">完成</span></div></div></div></div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Flow|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">四個步驟，卡住時都有下一步</h2><p style="margin: 0; font-size: 14px; color: #5E625F">示意圖，依實際流程重新整理，不含公司內部資料。</p></div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 24px">
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">01</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">輸入手機或 Email</h3><p style="margin: 0; font-size: 14px; color: #3C403E">一個欄位接受兩種格式，說明文字依市場寫出手機位數與範例。</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">輸入錯誤時：提示正確格式與範例</p></div><img src="img/49c04497192768a2bdd0db55e2f253d6.png" alt="輸入手機或 Email" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">02</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">資格檢查</h3><p style="margin: 0; font-size: 14px; color: #3C403E">手機號狀態需已驗證、只對應到一個帳號；Email 狀態需已驗證。</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">不符資格時：一鍵改用另一種方式</p></div><img src="img/99ae1541dc9a41ac9d7aa3d54df36132.png" alt="資格檢查" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">03</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">OTP 驗證</h3><p style="margin: 0; font-size: 14px; color: #3C403E">沿用既有的 OTP 模組，倒數、有效期與次數上限和其他驗證一致。</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">次數用完時：改用另一種 OTP，例如手機簡訊次數用完，就請用戶改用 Email 驗證</p></div><img src="img/27415ae66e716d9c9cf932bde097c4bd.png" alt="OTP 驗證" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">04</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">重設密碼</h3><p style="margin: 0; font-size: 14px; color: #3C403E">先顯示用戶名，再依帳號是否被鎖，給不同的說明與選項。</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">被鎖帳時：重設成功即解鎖</p></div><img src="img/81e2b3962904f8c3ab3b287064b0699d.png" alt="重設密碼" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
</ol>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Key Decisions|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">關鍵設計決策</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px">
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9.5 12l2 2 3.5-4"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">資安</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">不回答「有沒有註冊」</h3><p style="margin: 0; font-size: 14px; color: #3C403E">輸入未註冊的手機或 Email，一樣進到 OTP 頁，倒數照跑，只是不會寄出驗證碼。畫面上看不出差別，也就沒辦法用這個入口逐一試探。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 12h12"></path><path d="M12 8l4 4-4 4"></path><path d="M20 5v14"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">不符合資格</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">擋下時，直接給下一條路</h3><p style="margin: 0; font-size: 14px; color: #3C403E">手機無法對應到唯一帳號時，popup 的主按鈕是「改用 Email 找回」，按下後留在原頁直接切換；「聯繫客服」放在次按鈕，是最後的選項。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 9h13l-3-3"></path><path d="M20 15H7l3 3"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">OTP 次數用完</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">先換一種方式，兩種都用完才擋下</h3><p style="margin: 0; font-size: 14px; color: #3C403E">手機 OTP 次數用完，就改用 Email 驗證，反之亦然。兩種都用完，才顯示「超過嘗試次數」。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">重設密碼頁</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">很多人只是忘了用戶名</h3><p style="margin: 0; font-size: 14px; color: #3C403E">頁面最上方先顯示用戶名。帳號沒被鎖的話，旁邊就有「前往登入」，只忘了用戶名的人不必重設密碼。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 7.5-2"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">被鎖帳時</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">被鎖帳後，可以直接進入找回流程</h3><p style="margin: 0; font-size: 14px; color: #3C403E">登入失敗 5 次後，鎖帳 popup 的按鈕直接帶進找回流程；重設密碼成功，帳號也同時解鎖。</p></div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">例外流程才是關鍵</h3><p style="margin: 0; color: #3C403E">順利的路徑只有一條，會卡住的情況卻很多。我花最多時間的，是替每一種卡住的情況設計下一步，因為用戶走到這裡時通常已經很著急。</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">好用和安全要一起想</h3><p style="margin: 0; color: #3C403E">直接告訴用戶「這支手機沒註冊」最直覺，但也等於讓人可以拿來試探。假 OTP 頁是我們找到的折衷：一般用戶幾乎不受影響，想試探的人也問不出結果。</p></div>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 20px; align-items: baseline"><span style="font-family: 'Cormorant Garamond', serif; font-size: 72px; line-height: 1; color: #A8482F">02</span><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #5E625F">Brand A｜2026</span></div>
<h1 class="hero-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 60px; font-weight: 500; line-height: 1.15">Username &amp; password recovery</h1>
<p style="margin: 0; max-width: 760px; font-size: 18px; color: #3C403E">When users forget their username or password, or get locked out, recovery is their only way back. I designed and shipped it for Brand A: I brought the flow back on-site, gave every point where users get stuck a self-service next step, and made sure no one can use it to find out who is registered.</p>
<dl class="meta" style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #C9C3B4; border: 1px solid #C9C3B4">
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">ROLE</dt><dd style="margin: 0; font-size: 14px">Lead UI/UX designer, Brand A</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">SCOPE</dt><dd style="margin: 0; font-size: 14px">Brand A, 3 markets, app &amp; web</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">FLOW</dt><dd style="margin: 0; font-size: 14px">Input, eligibility, OTP, reset</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">STATUS</dt><dd style="margin: 0; font-size: 14px">Live</dd></div>
</dl>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Background|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">The problem</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">People arrive here already a little anxious: they forgot their username or password, or failed to log in five times and got locked out. Before, recovery meant typing an email, clicking a link in the inbox and resetting the password in a separate tab, and the link expired after a countdown. Anyone whose mail never came or whose link ran out had to contact support.</p>
<p style="margin: 0">The old sign-up form required an email, so existing users all had one. But sign-up no longer asked for an email (see <a href="work01.html">Work 01</a>), so new users might not have one at all. The old flow simply could not reach them, which made phone recovery a must. This time we brought the whole flow back onto the main site, while remembering it is also the entry point most open to abuse.</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">One phone, many accounts</h3><p style="margin: 0; font-size: 14px; color: #3C403E">A phone number can be shared by several accounts, so it may not point to just one.</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Don't reveal who's registered</h3><p style="margin: 0; font-size: 14px; color: #3C403E">Saying "this number isn't registered" lets anyone test numbers one by one.</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">Stuck means a support ticket</h3><p style="margin: 0; font-size: 14px; color: #3C403E">A missing code, a used-up limit, an ineligible number: each dead end turns into a support request.</p></div>
</div>
</div>
</section>

 flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 14px; line-height: 1.5">Set a password in a new tab</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #A8482F; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; color: #8A3A25"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #A8482F; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"></circle><path d="M12 9v4l2.5 2"></path><path d="M9 2h6"></path></svg></span><span style="font-size: 14px; line-height: 1.5; font-weight: 500">Link expired, start over</span></div></div></div></div>
</div>

<div style="display: grid; grid-template-columns: minmax(0, 230px) minmax(0, 1fr); gap: 16px 32px; align-items: center" class="ba-row">

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch"><div style="flex: 4 1 720px; min-width: 0; background: #EFEBE1; border: 1.5px solid #C9C3B4; border-radius: 14px; padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.12em; color: #5E625F">MAIN SITE</span><div style="display: flex; flex-wrap: wrap; gap: 8px"><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">1</span><span style="font-size: 14px; line-height: 1.5">Enter phone or email</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">2</span><span style="font-size: 14px; line-height: 1.5">Enter the code on the same page</span></div><div style="flex: 1 1 140px; min-width: 0; background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #1F2427; color: #F3F0E8; font-family: 'DM Mono', monospace; font-size: 11px; display: flex; align-items: center; justify-content: center">3</span><span style="font-size: 14px; line-height: 1.5">Reset password</span></div><div style="flex: 1 1 140px; min-width: 0; background: #DCEBDD; border: 1px solid #9CC3A2; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 10px; color: #24502C"><span style="flex: 0 0 auto; width: 22px; height: 22px; border-radius: 50%; background: #24502C; color: #FFFFFF; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span><span style="font-size: 14px; line-height: 1.5; font-weight: 500">Done</span></div></div></div></div>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Flow|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">Four steps, a next step whenever stuck</h2><p style="margin: 0; font-size: 14px; color: #5E625F">A redrawn summary of the real flow, with no company data.</p></div>
<ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 24px">
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">01</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Phone or email</h3><p style="margin: 0; font-size: 14px; color: #3C403E">One field takes either format; helper text shows each market's phone length and an example.</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">If mistyped: show the right format and an example</p></div><img src="img/49c04497192768a2bdd0db55e2f253d6.png" alt="Phone or email" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">02</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Eligibility</h3><p style="margin: 0; font-size: 14px; color: #3C403E">The mobile number must be verified and linked to only one account; the email must be verified.</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">If ineligible: one tap to the other method</p></div><img src="img/99ae1541dc9a41ac9d7aa3d54df36132.png" alt="Eligibility" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">03</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">OTP</h3><p style="margin: 0; font-size: 14px; color: #3C403E">Reuses the existing OTP module, so timers, expiry and limits match other checks.</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">If out of attempts: switch OTP type. For example, when SMS codes run out, ask the user to verify by email instead</p></div><img src="img/27415ae66e716d9c9cf932bde097c4bd.png" alt="OTP" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
<li style="background: #FFFFFF; border: 1px solid #C9C3B4; border-radius: 12px; padding: 24px; display: flex; flex-wrap: wrap; align-items: center; gap: 24px 40px"><div style="flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">04</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Reset password</h3><p style="margin: 0; font-size: 14px; color: #3C403E">Shows the username first, then adapts to whether the account is locked.</p><p style="margin: 0; padding-top: 12px; border-top: 1px dashed #C9C3B4; font-size: 13px; color: #8A3A25">If locked: a reset unlocks the account</p></div><img src="img/81e2b3962904f8c3ab3b287064b0699d.png" alt="Reset password" onClick="{{openZoom}}" style="cursor: zoom-in; flex: 1 1 420px; min-width: 0; width: 100%; aspect-ratio: 760 / 600; object-fit: cover; border-radius: 8px; display: block"></li>
</ol>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px 0; display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Key Decisions|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">Key design decisions</h2></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px">
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"></path><path d="M9.5 12l2 2 3.5-4"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">SECURITY</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Never confirm who's registered</h3><p style="margin: 0; font-size: 14px; color: #3C403E">An unregistered phone or email still lands on the OTP page, timer and all, but no code is sent. Nothing on screen differs, so the page can't be used to probe numbers one by one.</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 12h12"></path><path d="M12 8l4 4-4 4"></path><path d="M20 5v14"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">NOT ELIGIBLE</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">A blocked path offers the next one</h3><p style="margin: 0; font-size: 14px; color: #3C403E">If a phone doesn't map to one account, the popup's main button is "Recover by email", switching in place; "Contact support" is the secondary button, the last resort.</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M4 9h13l-3-3"></path><path d="M20 15H7l3 3"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">OTP LIMIT</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Switch methods first, block only when both run out</h3><p style="margin: 0; font-size: 14px; color: #3C403E">When phone OTP attempts run out, email takes over, and vice versa. Only when both are used up does "Too many attempts" appear.</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><circle cx="12" cy="8" r="4"></circle><path d="M5 20c1.5-3.5 4-5 7-5s5.5 1.5 7 5"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">RESET PAGE</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Many only forgot the username</h3><p style="margin: 0; font-size: 14px; color: #3C403E">The username comes first. If the account isn't locked, "Log in" sits right next to it, so people who only forgot their username skip the reset.</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 7.5-2"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">LOCKED OUT</span><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">From lockout straight into recovery</h3><p style="margin: 0; font-size: 14px; color: #3C403E">After five failed logins, the lockout popup leads straight into recovery, and a successful reset unlocks the account.</p></div>
</div>
</section>

<section style="background: #1F2427; color: #F3F0E8; margin-top: 112px; padding: 112px 24px">
<div style="max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #E59A7F">Outcome|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">Outcome</h2></div>
<div style="display: flex; flex-wrap: wrap; gap: 24px">
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">Live in three markets</span><span style="font-size: 14px; color: #D6D3CA">Shipped for Brand A across three markets, on app and web; recovery no longer leaves the main site.</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">Support as the last step</span><span style="font-size: 14px; color: #D6D3CA">Every dead end offers a self-serve next step first; support is needed only when both phone and email fail.</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Cormorant Garamond', serif; font-size: 28px; line-height: 1.3">A reference for other brands</span><span style="font-size: 14px; color: #D6D3CA">Later brands based their recovery design on Brand A's flow.</span></div>
</div>
</div>
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Reflection|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 38px; font-weight: 500">Reflection</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Edge cases are what matter</h3><p style="margin: 0; color: #3C403E">There is only one smooth path, but many ways to get stuck. Most of my time went into designing a next step for each of them, because users who end up here are usually already anxious.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Usability and security together</h3><p style="margin: 0; color: #3C403E">Telling users "this number isn't registered" is the most natural option, but it also lets people probe. The decoy OTP page was our compromise: regular users barely notice, and anyone probing learns nothing.</p></div>
<div style="display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 26px; font-weight: 500">Define the measure first</h3><p style="margin: 0; color: #3C403E">The goal was to reduce support load, but no tracking was set up before launch, so the effect couldn't be verified. Next time I would agree on a metric with the PM early, such as recovery-related support requests.</p></div>
</div>
</section>
</sc-if>

<div class="zm" role="dialog" aria-modal="true" aria-label="{{t.zoom}}" onClick="{{closeZoom}}" style="position: fixed; inset: 0; z-index: 50; background: rgba(31,36,39,.94); overflow: auto; display: flex; align-items: center; justify-content: center; padding: 56px 24px 32px; cursor: zoom-out">

</div>

<script src="dc.js"></script>
<script>

class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { lang: 'zh', zoom: null };
try { if (window.localStorage.getItem('fifi-lang') === 'en') this.state = { lang: 'en', zoom: null }; } catch (e) {}
try { window.addEventListener('storage', (ev) => { if (ev.key === 'fifi-lang') this.setState({ lang: ev.newValue === 'en' ? 'en' : 'zh' }); }); } catch (e) {}
}
renderVals() {
var isZh = this.state.lang === 'zh';
var base = 'min-height: 32px; padding: 4px 14px; border: 0; cursor: pointer; font-family: "DM Mono", monospace; font-size: 12px; letter-spacing: 0.08em; ';
var on = base + 'background: #1F2427; color: #F3F0E8;';
var off = base + 'background: transparent; color: #1F2427;';
var t = isZh
? { pl: '上一個', pt: '01 跨三品牌 Onboarding 優化', nl: '下一個', nt: '03 AI 輔助的 UIUX 決策庫', zoom: '放大檢視', close: '關閉', pan: '左右滑動查看完整圖片，點一下關閉', back: '← 作品', prev: '← 01 跨三品牌 Onboarding 優化', all: '所有作品', next: '03 AI 輔助的 UIUX 決策庫 →' }
: { pl: 'PREVIOUS', pt: '01 Onboarding', nl: 'NEXT', nt: '03 Decision library', zoom: 'Enlarged image', close: 'Close', pan: 'Swipe to pan, tap to close', back: '← Works', prev: '← 01 Onboarding', all: 'All works', next: '03 Decision library →' };
return {
t: t,
isZh: isZh,
isEn: !isZh,
zhStyle: isZh ? on : off,
enStyle: isZh ? off : on,
zoomOpen: !!this.state.zoom,
zoomSrc: this.state.zoom || '',
openZoom: (ev) => { var el = ev && (ev.currentTarget || ev.target); var src = el && el.getAttribute ? el.getAttribute('src') : null; if (src) this.setState({ lang: this.state.lang, zoom: src }); },
closeZoom: (ev) => { if (ev && ev.stopPropagation) ev.stopPropagation(); this.setState({ lang: this.state.lang, zoom: null }); },
setZh: () => { try { window.localStorage.setItem('fifi-lang', 'zh'); } catch (e) {} this.setState({ lang: 'zh', zoom: null }); },
setEn: () => { try { window.localStorage.setItem('fifi-lang', 'en'); } catch (e) {} this.setState({ lang: 'en', zoom: null }); }
};
}
}

DC.mount(Component);
</script>
