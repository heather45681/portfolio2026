<h1 class="hero-title" style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 52px; font-weight: 700; line-height: 1.4">一套系統、三家公司：採購系統的 design system</h1>
<p style="margin: 0; max-width: 760px; font-size: 18px; color: #3C403E">原本只給一家公司使用的採購與報帳系統，後來擴增為集團三家公司共用。我負責介面設計，以 Bootstrap 建立可換膚的 design system，並在前端人力不足時接手開發，用 React 與 TypeScript 完成所有畫面與功能。</p>
<dl class="meta" style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #C9C3B4; border: 1px solid #C9C3B4">
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">角色</dt><dd style="margin: 0; font-size: 14px">UI/UX 設計師・前端開發</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">範圍</dt><dd style="margin: 0; font-size: 14px">3 家公司・採購／收貨／請款</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">技術</dt><dd style="margin: 0; font-size: 14px">Bootstrap・React・TypeScript</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">狀態</dt><dd style="margin: 0; font-size: 14px">三家公司皆上線使用</dd></div>
<div style="grid-column: 1 / -1; background: #FBF9F4; padding: 20px; display: flex; flex-direction: column; gap: 6px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">成果</dt><dd style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.6">三家公司共用同一套系統上線使用・design system 與 Figma 元件庫交付公司與工程師</dd></div>
</dl>
<img src="img/b9e6307c281a36006e3e2cd558a1c6d0.png" alt="同一套採購系統套用三種品牌主題的畫面，旁邊是 Figma 元件庫中按鈕、表單、勾選、開關、Modal 與狀態標籤的狀態變體" onClick="{{openZoom}}" style="cursor: zoom-in; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; margin-top: 12px">

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Background|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">背景與問題</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">系統原本是為一家公司設計的。擴增為三家共用後，每家公司都要看到自己的 logo 與企業色；各公司的會計習慣不同，部分流程也需要客製化。</p>
<p style="margin: 0">挑戰是讓同一套系統服務三家公司，而不是為每家各做一套畫面。</p>
<p style="margin: 8px 0 -4px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #A8482F">限制條件</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">以 Bootstrap 為基礎</h3><p style="margin: 0; font-size: 14px; color: #3C403E">主題與元件都要在 Bootstrap 的架構內完成。</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">前端人力不足</h3><p style="margin: 0; font-size: 14px; color: #3C403E">前端開發人手不夠，由我接手。</p></div>
<div style="flex: 1 1 200px; min-width: 0; border-top: 2px solid #1F2427; padding-top: 14px; display: flex; flex-direction: column; gap: 6px"><h3 style="margin: 0; font-size: 16px">我原本不懂 .NET</h3><p style="margin: 0; font-size: 14px; color: #3C403E">系統使用 .NET，接手前端時我完全不會。</p></div>
</div>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Key Decisions|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">關鍵決策</h2></div>

<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16z" fill="#A8482F" stroke="none"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">換膚</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">版面共用，品牌元素可換</h3><p style="margin: 0; font-size: 14px; color: #3C403E">團隊討論後決定用 design system 處理換膚：整體畫面與版面三家共用，logo、企業色等品牌元素跟著公司切換。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><rect x="3" y="8" width="4" height="8" rx="1"></rect><rect x="10" y="8" width="4" height="8" rx="1"></rect><rect x="17" y="8" width="4" height="8" rx="1"></rect></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">色彩</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">善用框架，不重造輪子</h3><p style="margin: 0; font-size: 14px; color: #3C403E">只決定主色，100–900 的色階由 Bootstrap 自動延伸；我在程式端把主題變數設定好。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><path d="M16.5 13v7M13 16.5h7"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">元件庫</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">Figma 元件與程式碼一一對應</h3><p style="margin: 0; font-size: 14px; color: #3C403E">按鈕、表單、狀態標籤、Modal 等元件，含完整狀態與尺寸變體。前端也是我開發，設計稿與程式碼由同一人維護；元件庫也正式交付，留給公司與工程師使用。</p></div>
<div style="background: #FBF9F4; border-radius: 16px; padding: 28px; display: flex; flex-direction: column; gap: 10px"><svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#A8482F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="display: block"><path d="M8 8l-4 4 4 4"></path><path d="M16 8l4 4-4 4"></path><path d="M13.5 6l-3 12"></path></svg><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #A8482F">接手開發</span><h3 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 20px">不懂 .NET，也把前端做完</h3><p style="margin: 0; font-size: 14px; color: #3C403E">請後端工程師帶、自己查文件、先只碰前端，三種方式並用，最後以 React 與 TypeScript 完成所有畫面與功能。</p></div>
</div>

<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Noto Serif TC', serif; font-size: 24px; line-height: 1.5">design system 正式交付</span><span style="font-size: 14px; color: #D6D3CA">design system 與 Figma 元件庫交給公司留存，供工程師使用。</span></div>
<div style="flex: 1 1 300px; min-width: 0; border-top: 1px solid #4A504D; padding-top: 20px; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Noto Serif TC', serif; font-size: 24px; line-height: 1.5">設計與前端一致</span><span style="font-size: 14px; color: #D6D3CA">介面設計、元件庫與前端開發都由我負責，設計稿與實際畫面保持一致。</span></div>

<section style="max-width: 1200px; margin: 0 auto; padding: 112px 24px; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Reflection|</p><h2 style="margin: 0; font-family: 'Noto Serif TC', serif; font-size: 30px">反思</h2></div>

<section style="max-width: 1200px; margin: 0 auto; padding: 56px 24px 64px; display: flex; flex-direction: column; gap: 28px">
<div style="display: flex; gap: 20px; align-items: baseline"><span style="font-family: 'Cormorant Garamond', serif; font-size: 72px; line-height: 1; color: #A8482F">02</span><span style="font-family: 'DM Mono', monospace; font-size: 13px; color: #5E625F">2021 – 2024</span></div>
<h1 class="hero-title" style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 60px; font-weight: 500; line-height: 1.15">One system, three companies: a design system for procurement</h1>
<p style="margin: 0; max-width: 760px; font-size: 18px; color: #3C403E">A procurement and expense system built for one company later had to serve three companies in the same group. I designed the interface, built a themable design system on Bootstrap, and when front-end help ran short, took over development and built every screen and feature with React and TypeScript.</p>
<dl class="meta" style="margin: 8px 0 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: #C9C3B4; border: 1px solid #C9C3B4">
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">ROLE</dt><dd style="margin: 0; font-size: 14px">UI/UX designer, front-end developer</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">SCOPE</dt><dd style="margin: 0; font-size: 14px">3 companies; purchasing, receiving, claims</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">STACK</dt><dd style="margin: 0; font-size: 14px">Bootstrap, React, TypeScript</dd></div>
<div style="background: #F3F0E8; padding: 20px; display: flex; flex-direction: column; gap: 4px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">STATUS</dt><dd style="margin: 0; font-size: 14px">Live at all three companies</dd></div>
<div style="grid-column: 1 / -1; background: #FBF9F4; padding: 20px; display: flex; flex-direction: column; gap: 6px"><dt style="font-family: 'DM Mono', monospace; font-size: 12px; color: #A8482F">OUTCOME</dt><dd style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.6">One shared system live at all three companies · design system and Figma library handed over to the company and engineers</dd></div>
</dl>
<img src="img/b9e6307c281a36006e3e2cd558a1c6d0.png" alt="The same procurement system in three brand themes, beside the Figma component library showing state variants of buttons, form fields, checkboxes, switches, a modal and status badges" onClick="{{openZoom}}" style="cursor: zoom-in; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; display: block; margin-top: 12px">
</section>

<section style="max-width: 1200px; margin: 0 auto; padding: 64px 24px 0; display: flex; flex-wrap: wrap; gap: 48px">
<div style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 4px"><p style="margin: 0; font-family: 'DM Mono', monospace; font-size: 13px; letter-spacing: 0.16em; color: #A8482F">Background|</p><h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-size: 40px; font-weight: 500">Background</h2></div>
<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">
<p style="margin: 0">The system was designed for one company. Once three companies shared it, each needed to see its own logo and brand colors, and because their accounting practices differed, some flows needed customizing.</p>
<p style="margin: 0">The challenge: let one system serve three companies, instead of building a separate set of screens for each.</p>
<p style="margin: 8px 0 -4px; font-family: 'DM Mono', monospace; font-size: 12px; letter-spacing: 0.12em; color: #A8482F">CONSTRAINTS</p>
<div style="display: flex; flex-wrap: wrap; gap: 16px">
